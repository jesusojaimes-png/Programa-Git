
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión-Eventlap</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Eventlap.Net</h1>
        <p>Tu espacio para descubrir eventos</p>
    </header>

    <main>
        <section class="bienvenida">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus datos para continuar.</p>

            <form id="formularioLogin">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required>

                <button type="submit" class="boton">Ingresar</button>
            </form>

            <p>
                <a href="registro.html">Crear una cuenta</a>
            </p>

            <p>
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </p>

            <p>
    <a href="editar.html">Editar mi información</a>
</p>

            <p>
                <a href="../index.html">Volver al inicio</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Eventlap©2026</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
