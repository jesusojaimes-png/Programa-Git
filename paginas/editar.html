


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar información - Eventlap</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <header>
        <h1>Eventlap.Net</h1>
        <p>Actualiza tu información personal</p>
    </header>

    <main>
        <section class="bienvenida">
            <h2>Editar información</h2>
            <p>Modifica tus datos personales.</p>

            <form id="formularioEditar">
                <label for="nombreEditar">Nombre completo</label>
                <input type="text" id="nombreEditar"
                    value="Usuario Eventlap" required>

                <label for="correoEditar">Correo electrónico</label>
                <input type="email" id="correoEditar"
                    value="usuario@ejemplo.com" required>

                <button type="submit" class="boton">
                    Guardar cambios
                </button>
            </form>

            <p>
                <a href="inicio.html">Volver al inicio de sesión</a>
            </p>

            <p>
                <a href="../index.html">Volver a la página principal</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Eventlap © 2026</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
